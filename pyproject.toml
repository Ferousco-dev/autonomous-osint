[project]
name = "autonomous-osint"
version = "0.1.0"
description = "Modular, persistent, autonomous OSINT research engine and Antigravity skill."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
]

[project.scripts]
osint-engine = "osint_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osint_engine"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
